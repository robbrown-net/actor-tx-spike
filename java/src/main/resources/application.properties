spring.application.name=actor-tx
spring.main.banner-mode=off
# The dashboard and control API have no authentication or TLS: loopback only by default.
server.address=127.0.0.1
server.port=4040
# The JSON the Elixir dashboard already speaks: snake_case.
spring.jackson.property-naming-strategy=SNAKE_CASE
management.endpoints.web.exposure.include=health,info,metrics
# Provider speed of the demo world (1.0 is human-watchable; smaller is faster).
actortx.demo.pace=1.0

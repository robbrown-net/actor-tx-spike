<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Actor TX Monitor</title>
<style>
  :root {
    --bg:#0e1116; --panel:#161b22; --panel2:#1c2330; --line:#2a3342; --text:#e6edf3; --dim:#8b98a9;
    --ok:#3fb950; --warn:#d29922; --bad:#f85149; --info:#58a6ff; --violet:#bc8cff; --teal:#39c5cf;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:12px 20px; align-items:center; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  .conn { font-size:12px; color:var(--dim); }
  .conn i { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--bad); margin-right:6px; }
  .conn.up i { background:var(--ok); }
  .grp { display:flex; align-items:center; gap:8px; }
  label { color:var(--dim); font-size:12px; }
  input[type=number], input[type=text] { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 8px; width:90px; }
  input[type=range] { accent-color:var(--info); }
  button { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer; font-size:12px; }
  button:hover { border-color:var(--info); }
  button.primary { background:#1f6feb; border-color:#1f6feb; }
  button.on { background:var(--ok); border-color:var(--ok); color:#04130a; }
  main { display:grid; grid-template-columns:minmax(300px,360px) minmax(280px,380px) 1fr; gap:12px; padding:12px; height:calc(100vh - 62px); }
  @media (max-width:1000px) { main { grid-template-columns:1fr; height:auto; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:10px; display:flex; flex-direction:column; min-height:0; }
  section > h2 { margin:0; padding:10px 12px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); border-bottom:1px solid var(--line); display:flex; justify-content:space-between; }
  .scroll { overflow:auto; padding:10px; display:flex; flex-direction:column; gap:10px; min-height:0; }
  .hint { color:var(--dim); font-size:12px; padding:8px 12px; border-bottom:1px solid var(--line); }
  /* provider cards */
  .card { background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:10px; border-left:4px solid var(--dim); }
  .card.healthy { border-left-color:var(--ok); } .card.degraded { border-left-color:var(--warn); }
  .card.stalled { border-left-color:var(--bad); } .card.quarantined { border-left-color:var(--violet); }
  .card .top { display:flex; justify-content:space-between; align-items:center; }
  .card .name { font-weight:600; }
  .pill { font-size:11px; padding:1px 8px; border-radius:99px; border:1px solid currentColor; }
  .pill.healthy { color:var(--ok); } .pill.degraded { color:var(--warn); } .pill.stalled { color:var(--bad); }
  .pill.quarantined { color:var(--violet); } .pill.unknown { color:var(--dim); }
  .metrics { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:8px 0; font-size:12px; }
  .metrics div { background:var(--bg); border-radius:6px; padding:4px 6px; }
  .metrics b { display:block; font-size:13px; font-variant-numeric:tabular-nums; }
  .metrics span { color:var(--dim); font-size:10px; text-transform:uppercase; }
  .faults { color:var(--warn); font-size:11px; margin-bottom:6px; }
  .actions { display:flex; flex-wrap:wrap; gap:4px; }
  .actions button { padding:3px 7px; font-size:11px; }
  /* transactions */
  .tx { background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:8px 10px; cursor:pointer; }
  .tx.sel { border-color:var(--info); }
  .tx .row { display:flex; justify-content:space-between; font-size:12px; color:var(--dim); }
  .tx .id { color:var(--text); font-weight:600; }
  .pipe { display:flex; gap:3px; margin:7px 0 4px; }
  .pipe span { flex:1; text-align:center; font-size:10px; padding:3px 0; background:var(--bg); border-radius:4px; color:var(--dim); }
  .pipe span.done { background:#12361f; color:var(--ok); }
  .pipe span.now { background:#0d2a52; color:var(--info); animation:pulse 1.2s infinite; }
  .pipe span.bad { background:#3a1517; color:var(--bad); }
  .pipe span.review { background:#2f2410; color:var(--warn); }
  @keyframes pulse { 50% { opacity:.55; } }
  .badge { font-size:11px; padding:1px 7px; border-radius:99px; background:var(--bg); }
  .badge.completed { color:var(--ok); } .badge.failed { color:var(--bad); } .badge.needs_review { color:var(--warn); }
  .badge.compensating,.badge.reconciling { color:var(--violet); }
  /* story */
  .ev { display:grid; grid-template-columns:62px 118px 1fr; gap:8px; font-size:12.5px; padding:3px 6px; border-radius:5px; }
  .ev:hover { background:var(--panel2); }
  .ev .t { color:var(--dim); font-variant-numeric:tabular-nums; }
  .ev .a { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .a.payment { color:var(--info); } .a.selector { color:var(--violet); } .a.provider { color:var(--teal); }
  .a.sentinel { color:var(--warn); } .a.operator { color:#ff7b72; }
  .ev.bad .m { color:var(--bad); } .ev.good .m { color:var(--ok); } .ev.warn .m { color:var(--warn); }
  .ev .txid { color:var(--dim); font-weight:600; }
  .empty { color:var(--dim); padding:16px; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>Actor TX Monitor</h1>
  <span class="conn" id="conn"><i></i><span>connecting…</span></span>
  <div class="grp"><label>Amount</label><input type="number" id="amount" value="1000" min="1" step="100">
    <button class="primary" id="submit">Submit transaction</button>
    <button id="auto">Auto traffic: off</button></div>
  <div class="grp"><label>Pace <span id="paceVal">1.0×</span></label><input type="range" id="pace" min="0.1" max="2" step="0.1" value="1"></div>
  <div class="grp">
    <label>cost</label><input type="range" id="wCost" min="0" max="1" step="0.05" value="0.6">
    <label>speed</label><input type="range" id="wSpeed" min="0" max="1" step="0.05" value="0.3">
    <label>reliab.</label><input type="range" id="wRel" min="0" max="1" step="0.05" value="0.1">
    <label>max bps</label><input type="number" id="bps" value="100" min="0" style="width:64px">
    <button id="applyPolicy">Apply policy</button>
  </div>
</header>
<main>
  <section>
    <h2>Providers <span id="provCount"></span></h2>
    <div class="hint">Third parties we do not control. Break them and watch the system react.</div>
    <div class="scroll" id="providers"></div>
  </section>
  <section>
    <h2>Transactions <span id="txCount"></span></h2>
    <div class="hint">quote ▸ accept ▸ authorise ▸ pay. Click one to follow its story.</div>
    <div class="scroll" id="txs"></div>
  </section>
  <section>
    <h2><span id="storyTitle">Story: everything</span><button id="clearSel" style="display:none">show all</button></h2>
    <div class="scroll" id="story"></div>
  </section>
</main>
<script>
const STAGES = ['quoting','accepting','authorising','paying','completed'];
const S = { events: [], txs: new Map(), prov: new Map(), snap: null, sel: null, dirty: true };

function post(body) {
  return fetch('/api/control', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body) })
    .then(r => r.json()).then(j => { if (!j.ok) alert(j.error || 'failed'); refreshSnapshot(); return j; });
}
function refreshSnapshot() {
  fetch('/api/snapshot').then(r => r.json()).then(s => { S.snap = s; S.dirty = true; syncControls(s); }).catch(()=>{});
}
function syncControls(s) {
  const a = document.getElementById('auto'); a.textContent = 'Auto traffic: ' + (s.auto ? 'on' : 'off'); a.classList.toggle('on', s.auto);
}

function ingest(ev) {
  S.events.push(ev); if (S.events.length > 3000) S.events.shift();
  if (ev.kind === 'health' && ev.data && ev.data.provider) S.prov.set(ev.data.provider, ev.data);
  if (ev.tx) {
    let tx = S.txs.get(ev.tx);
    if (!tx) { tx = { id: ev.tx, at: ev.at, phase: 'received', reached: -1, amount: null, provider: null, events: [] }; S.txs.set(ev.tx, tx); }
    tx.events.push(ev);
    if (ev.actor === 'payment') {
      const p = ev.data && ev.data.phase;
      if (p) { tx.phase = p; const i = STAGES.indexOf(p); if (i > tx.reached) tx.reached = i; }
      if (ev.kind === 'tx_received') tx.amount = ev.data.amount;
      if (ev.kind === 'provider_chosen') tx.provider = ev.data.provider;
      if (ev.kind === 'tx_completed') { tx.phase = 'completed'; tx.reached = STAGES.length - 1; tx.end = ev.at; }
      if (ev.kind === 'tx_failed') { tx.phase = 'failed'; tx.end = ev.at; }
      if (ev.kind === 'needs_review') { tx.phase = 'needs_review'; tx.end = ev.at; }
    }
  }
  S.dirty = true;
}

function evClass(ev) {
  const k = ev.kind;
  if (['step_failed','tx_failed','quote_failed','quote_excluded','undo_retry'].includes(k)) return 'bad';
  if (['needs_review','in_doubt','reconcile_pending','cancel_by_key','failover','step_retry','provider_skipped'].includes(k)) return 'warn';
  if (['tx_completed','step_succeeded','reconciled','selection_made','undone'].includes(k)) return 'good';
  return '';
}
const actorClass = a => a.startsWith('provider:') ? 'provider' : a;
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt = n => (typeof n === 'number' ? n.toFixed(4) : n);

function renderProviders() {
  const el = document.getElementById('providers');
  const list = S.snap ? S.snap.providers : [];
  document.getElementById('provCount').textContent = list.length ? list.length + ' providers' : '';
  el.innerHTML = list.map(p => {
    const live = S.prov.get(p.id) || {};
    const st = p.state;
    const faults = p.faults.length ? '<div class="faults">faults: ' + p.faults.map(f => esc(f.op.replace('_mode','')) + '=' + esc(f.mode)).join(', ') + '</div>' : '';
    const btn = (label, what, extra) => `<button data-p="${p.id}" data-do="${what}" ${extra||''}>${label}</button>`;
    return `<div class="card ${st}">
      <div class="top"><span class="name">${p.id}</span><span class="pill ${st}">${st}${p.recovering>0?' · recovering':''}</span></div>
      <div class="metrics">
        <div><span>rate</span><b>${fmt(p.rate)}</b></div>
        <div><span>fee</span><b>${p.fee}</b></div>
        <div><span>latency</span><b>${p.latency_ms}ms</b></div>
        <div><span>breaker</span><b>${p.breaker}</b></div>
        <div><span>p95</span><b>${Math.round(p.p95_ms)}ms</b></div>
        <div><span>errors</span><b>${Math.round(p.error_rate*100)}%</b></div>
        <div><span>in-flight</span><b>${p.in_flight}</b></div>
        <div><span>version</span><b>${esc(p.version || '–')}</b></div>
      </div>${faults}
      <div class="actions">
        ${btn('slow','slow')}${btn('stall','stall')}${btn('error','error')}${btn('reject quotes','reject')}
        ${btn('authorise fails','authorise_fails')}${btn('pay answer lost','pay_answer_lost')}${btn('pay vanishes','pay_vanishes')}
        ${btn('version drift','drift')}${btn('release','release')}${btn('heal','heal')}
      </div></div>`;
  }).join('') || '<div class="empty">waiting for snapshot…</div>';
}

function pipeline(tx) {
  const bad = tx.phase === 'failed', rev = tx.phase === 'needs_review';
  return '<div class="pipe">' + STAGES.map((s, i) => {
    let c = '';
    if (tx.phase === 'completed') c = 'done';
    else if (i < tx.reached) c = 'done';
    else if (i === tx.reached || s === tx.phase) c = bad ? 'bad' : rev ? 'review' : 'now';
    const label = {quoting:'quote',accepting:'accept',authorising:'authorise',paying:'pay',completed:'done'}[s];
    return `<span class="${c}">${label}</span>`;
  }).join('') + '</div>';
}

function renderTxs() {
  const el = document.getElementById('txs');
  const list = [...S.txs.values()].sort((a, b) => b.at - a.at);
  document.getElementById('txCount').textContent = list.length ? list.length + ' seen' : '';
  el.innerHTML = list.map(tx => {
    const dur = ((tx.end || Date.now()) - tx.at) / 1000;
    const note = ['compensating','reconciling'].includes(tx.phase) ? `<span class="badge ${tx.phase}">${tx.phase}</span>` : `<span class="badge ${tx.phase}">${tx.phase.replace('_',' ')}</span>`;
    return `<div class="tx ${S.sel === tx.id ? 'sel' : ''}" data-tx="${tx.id}">
      <div class="row"><span><span class="id">${tx.id}</span> · ${tx.amount ?? '?'}</span>${note}</div>
      ${pipeline(tx)}
      <div class="row"><span>${tx.provider ? 'via ' + tx.provider : 'choosing…'}</span><span>${dur.toFixed(1)}s</span></div></div>`;
  }).join('') || '<div class="empty">No transactions yet. Press “Submit transaction”.</div>';
}

function renderStory() {
  const el = document.getElementById('story');
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
  const tx = S.sel && S.txs.get(S.sel);
  const events = tx ? tx.events : S.events.slice(-250);
  const t0 = tx ? tx.at : null;
  document.getElementById('storyTitle').textContent = tx ? 'Story: ' + tx.id : 'Story: everything';
  document.getElementById('clearSel').style.display = tx ? '' : 'none';
  el.innerHTML = events.filter(e => tx || e.kind !== 'health' || true).map(ev => {
    const when = t0 !== null ? '+' + (ev.at - t0) + 'ms' : new Date(ev.at).toLocaleTimeString([], {hour12:false});
    const txTag = !tx && ev.tx ? `<span class="txid">${ev.tx} </span>` : '';
    return `<div class="ev ${evClass(ev)}"><span class="t">${when}</span><span class="a ${actorClass(ev.actor)}">${esc(ev.actor)}</span><span class="m">${txTag}${esc(ev.message)}</span></div>`;
  }).join('') || '<div class="empty">Nothing yet.</div>';
  if (atBottom) el.scrollTop = el.scrollHeight;
}

function frame() { if (S.dirty) { S.dirty = false; renderProviders(); renderTxs(); renderStory(); } requestAnimationFrame(frame); }

document.addEventListener('click', e => {
  const b = e.target.closest('button[data-do]');
  if (b) return post({ action:'provider', id:b.dataset.p, do:b.dataset.do });
  const tx = e.target.closest('.tx[data-tx]');
  if (tx) { S.sel = S.sel === tx.dataset.tx ? null : tx.dataset.tx; S.dirty = true; }
});
document.getElementById('clearSel').onclick = () => { S.sel = null; S.dirty = true; };
document.getElementById('submit').onclick = () => post({ action:'submit', amount:+document.getElementById('amount').value });
document.getElementById('auto').onclick = () => post({ action:'auto', on: !(S.snap && S.snap.auto) });
document.getElementById('pace').oninput = e => {
  document.getElementById('paceVal').textContent = (+e.target.value).toFixed(1) + '×';
  post({ action:'pace', factor:+e.target.value });
};
document.getElementById('applyPolicy').onclick = () => post({ action:'policy',
  weights:{ cost:+wCost.value, speed:+wSpeed.value, reliability:+wRel.value }, max_bps_from_best:+bps.value });

const conn = document.getElementById('conn');
function connect() {
  const es = new EventSource('/events');
  es.onopen = () => { conn.classList.add('up'); conn.lastElementChild.textContent = 'live'; };
  es.onerror = () => { conn.classList.remove('up'); conn.lastElementChild.textContent = 'reconnecting…'; };
  es.onmessage = m => ingest(JSON.parse(m.data));
}
connect(); refreshSnapshot(); setInterval(refreshSnapshot, 1500); requestAnimationFrame(frame);
</script>
</body>
</html>
